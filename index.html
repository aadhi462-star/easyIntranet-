<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0a" />
    <script>
      // Apply the saved light/dark choice before first paint (mirrors lib/theme.js).
      try {
        var p = localStorage.getItem('alumnizone:theme') || 'system';
        document.documentElement.dataset.theme = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>CommunityOne</title>
    <meta name="description" content="CommunityOne: one platform for every community. Discover communities, connect, join discussions and events, and learn together." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
